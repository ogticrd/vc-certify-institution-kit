# Superpuesto para TLS_MODE=proxy: el TLS lo termina el proxy inverso de la institución, no el kit.
# Caddy escucha solo HTTP, en :80 dentro del contenedor, y el servidor publica ÚNICAMENTE
# CADDY_HTTP_PORT (8080 por defecto). Ni el 80 ni el 443 del servidor se tocan. Se usa junto a
# docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml --env-file generated/.env.runtime …
# (generate-config.sh deja esa orden en generated/compose-args).
services:
  caddy:
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
